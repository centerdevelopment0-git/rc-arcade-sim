<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena RC (Multi-mobil)</title>
<style>
  body { margin:0; background:#0f1115; color:#e8eaed; font-family:system-ui,sans-serif; }
  header { padding:10px 14px; background:#1a1d24; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  header b { color:#fff; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; }
  .chip { display:flex; align-items:center; gap:6px; background:#20242e; padding:4px 10px; border-radius:20px; }
  .led { width:10px; height:10px; border-radius:50%; background:#444; box-shadow:0 0 0 rgba(0,0,0,0); transition:background .08s, box-shadow .08s; }
  .led.online { background:#2e9; }
  .led.data   { background:#ffd23f; box-shadow:0 0 10px #ffd23f; }
  .led.off    { background:#444; }
  canvas { display:block; margin:12px auto; background:#161922; border:1px solid #2a2e37; border-radius:10px; max-width:98vw; }
</style>
</head>
<body>
  <header>
    <b>🏟️ Arena RC</b>
    <span id="count">0 mobil</span>
    <div class="legend" id="legend"></div>
  </header>
  <canvas id="c" width="960" height="600"></canvas>

<script src="rc-state.js"></script>
<script>
const N = Math.max(1, Math.min(12, parseInt(new URLSearchParams(location.search).get('n') || '3', 10)));
const COLORS = ['#36c','#2e9','#e85','#b7f','#fd5','#5df','#f58','#8f8','#f88','#88f','#ff8','#8ff'];

// ---- bikin N mobil, tiap mobil = 1 koneksi WS (role:car) ----
const CARS = [];
for (let i = 1; i <= N; i++) {
  CARS.push({
    id:'car'+i, color:COLORS[(i-1)%COLORS.length],
    x: 120 + (i-1)* (820/Math.max(1,N-0.0001)) % 820, y: 120 + ((i*137)%360),
    heading: Math.random()*6, speed:0,
    throttle:0, steer:0, lastCmd:0, online:false, driver:null,
    controllers:0, connectedAt:0, state:null,
    speedMul:0.7, skills:[], boosting:false, fx:[],
    ws:null,
  });
}

function connect(car){
  const ws = new WebSocket(`ws://${location.host}`);
  car.ws = ws;
  ws.onopen = () => { car.online = true; car.connectedAt = Date.now(); ws.send(JSON.stringify({ type:'hello', role:'car', car:car.id })); };
  ws.onclose = () => { car.online = false; car.controllers = 0; setTimeout(()=>connect(car), 1000); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'control') { car.throttle = m.throttle||0; car.steer = m.steer||0; car.lastCmd = Date.now(); }
    if (m.type === 'presence') { car.driver = m.driver; car.controllers = m.controllers; }
    if (m.type === 'skills') { car.speedMul = m.speedMul||0.7; car.skills = m.skills||[]; car.boosting = (m.speedMul||0.7) > 0.71; }
  };
}
CARS.forEach(connect);

// telemetry tiap mobil 20x/detik
setInterval(() => {
  for (const car of CARS)
    if (car.ws && car.ws.readyState === 1)
      car.ws.send(JSON.stringify({ type:'telemetry', x:car.x|0, y:car.y|0, heading:+car.heading.toFixed(2), speed:+car.speed.toFixed(2) }));
}, 50);

// ---- LED legend ----
const legend = document.getElementById('legend');
CARS.forEach(car => {
  const chip = document.createElement('div'); chip.className='chip';
  chip.innerHTML = `<span class="led off" id="led-${car.id}"></span>
                    <span style="color:${car.color}">■</span> ${car.id.toUpperCase()}
                    <span id="stlab-${car.id}" style="color:#9aa0b0;font-size:11px"></span>`;
  legend.appendChild(chip);
});
document.getElementById('count').textContent = N + ' mobil';

// ---- fisika + render ----
const c = document.getElementById('c'), ctx = c.getContext('2d');
const ACCEL=440, FRICTION=1.5, MAXSPEED=240, TURN=2.4;
// catatan: terminal speed (ACCEL/FRICTION≈293) > MAXSPEED, jadi batas effMax
// (MAXSPEED*speedMul) BENAR-BENAR jadi penentu → turbo (0.7→1.0) terasa jelas.
let prev = performance.now();

function step(now){
  const dt = Math.min(0.05, (now - prev)/1000); prev = now;
  for (const car of CARS){
    if (Date.now() - car.lastCmd > 400) { car.throttle = 0; car.steer = 0; } // failsafe
    const effMax = MAXSPEED * (car.speedMul || 0.7);   // skill (turbo) menaikkan batas ini
    car.speed += car.throttle * ACCEL * dt;
    car.speed -= car.speed * FRICTION * dt;
    car.speed = Math.max(-effMax*0.5, Math.min(effMax, car.speed));
    car.heading += car.steer * TURN * dt * (car.speed/MAXSPEED);
    car.x += Math.cos(car.heading)*car.speed*dt;
    car.y += Math.sin(car.heading)*car.speed*dt;
    // wrap-around: tembus tepi, muncul di sisi seberang (arena tanpa batas)
    if (car.x < 0) car.x += c.width;  else if (car.x > c.width)  car.x -= c.width;
    if (car.y < 0) car.y += c.height; else if (car.y > c.height) car.y -= c.height;
    // efek asap & api (turbo) di belakang mobil
    spawnFx(car); updateFx(car, dt);
    // state RC + kode LED (pola kedip beda per state)
    const st = rcState({ online:car.online, controllers:car.controllers,
      msSinceCtrl: Date.now()-car.lastCmd,
      moving: Math.abs(car.throttle)>0.12 || Math.abs(car.steer)>0.12,
      justConnected: car.online && (Date.now()-car.connectedAt) < 1500 });
    car.state = st;
    const on = ledOn(st.pattern, performance.now());
    const led = document.getElementById('led-'+car.id);
    led.style.background = on ? st.color : '#2a2e37';
    led.style.boxShadow = (on && st.pattern!=='solid' && st.pattern!=='off') ? ('0 0 8px '+st.color) : 'none';
    document.getElementById('stlab-'+car.id).textContent = st.label;
  }
  draw();
  requestAnimationFrame(step);
}
requestAnimationFrame(step);

function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle='#222634'; ctx.lineWidth=1;
  for(let x=0;x<c.width;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,c.height); ctx.stroke(); }
  for(let y=0;y<c.height;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(c.width,y); ctx.stroke(); }
  for (const car of CARS) drawFx(car);                 // asap/api di bawah mobil
  for (const car of CARS){
    ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.heading); ctx.scale(1.3,1.3);
    drawBeam(car); drawF1(car);
    ctx.restore();
    // label + LED (koordinat dunia)
    ctx.textAlign='center';
    if (car.driver){ ctx.fillStyle='#9aa0b0'; ctx.font='10px system-ui'; ctx.fillText('👤 '+car.driver, car.x, car.y-40); }
    ctx.fillStyle = car.online ? car.color : '#555'; ctx.font='12px system-ui';
    ctx.fillText(car.id.toUpperCase(), car.x, car.y-28);
    if (car.state){ const lit = ledOn(car.state.pattern, performance.now());
      ctx.fillStyle = lit ? car.state.color : 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.arc(car.x+26, car.y-30, 4, 0, 7); ctx.fill(); }
  }
}

// ---- mobil gaya F1 (open-wheel, desain orisinal). Frame: +x = depan ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }
function drawF1(car){
  const col=car.color;
  // sayap belakang (lebar) + endplate
  ctx.fillStyle='#14161b'; ctx.fillRect(-30,-15,5,30);
  ctx.fillRect(-31,-16,7,4); ctx.fillRect(-31,12,7,4);
  // ban belakang (LEBAR) & ban depan (tipis) — roda terbuka khas F1
  ctx.fillStyle='#0d0d0f'; rr(-23,-17,14,8,2); rr(-23,9,14,8,2); rr(9,-15,11,6,2); rr(9,9,11,6,2);
  // SAYAP DEPAN lebar di paling depan (bentuk "hammerhead")
  ctx.fillStyle='#14161b'; rr(26,-17,7,34,2);
  ctx.fillStyle=col; ctx.fillRect(28,-16,2,32);
  // nose SEMPIT meruncing + bodi/chassis tapered
  ctx.fillStyle=col; ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(29,-2.5); ctx.lineTo(29,2.5); ctx.lineTo(6,4.5); ctx.lineTo(-8,8);
  ctx.lineTo(-20,6.5); ctx.lineTo(-23,3.5); ctx.lineTo(-23,-3.5); ctx.lineTo(-20,-6.5);
  ctx.lineTo(-8,-8); ctx.lineTo(6,-4.5); ctx.closePath(); ctx.fill(); ctx.stroke();
  // sidepod (badan melebar di tengah)
  ctx.fillStyle=col; rr(-15,-10.5,13,5,2); rr(-15,5.5,13,5,2);
  // engine cover (spine gelap ke belakang)
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath();
  ctx.moveTo(-2,-2.6); ctx.lineTo(-23,-1.4); ctx.lineTo(-23,1.4); ctx.lineTo(-2,2.6); ctx.closePath(); ctx.fill();
  // halo + kokpit + helm
  ctx.strokeStyle='#3a3f4a'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.ellipse(3,0,6.5,4.6,0,0,7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9.5,0); ctx.lineTo(6,0); ctx.stroke();
  ctx.fillStyle='#0b0d12'; ctx.beginPath(); ctx.ellipse(2.5,0,4.5,3.2,0,0,7); ctx.fill();
  ctx.fillStyle='#e8eaed'; ctx.beginPath(); ctx.arc(2.5,0,1.9,0,7); ctx.fill();
}
// ---- lampu sorot depan (arah maju) + lampu rem/mundur belakang ----
function drawBeam(car){
  const sp=car.speed, len=55+Math.min(45, Math.abs(sp)*0.3), fx=31;
  if (sp > 2){
    const g=ctx.createLinearGradient(fx,0,fx+len,0);
    g.addColorStop(0,'rgba(255,250,200,0.28)'); g.addColorStop(1,'rgba(255,250,200,0)');
    ctx.fillStyle=g; ctx.beginPath();
    ctx.moveTo(fx-2,-6); ctx.lineTo(fx+len,-22); ctx.lineTo(fx+len,22); ctx.lineTo(fx-2,6); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='#fffbe0'; ctx.fillRect(fx-2,-9,3,3); ctx.fillRect(fx-2,6,3,3);     // lampu depan
  const rb = sp < -1 ? 1 : 0.45; ctx.fillStyle=`rgba(255,45,45,${rb})`;             // lampu belakang
  ctx.fillRect(-29,-9,3,3); ctx.fillRect(-29,6,3,3);
}
// ---- partikel efek (asap & api turbo) ----
function rand(a){ return (Math.random()*2-1)*a; }
function spawnFx(car){
  const sp=Math.abs(car.speed);
  const rx=car.x - Math.cos(car.heading)*24, ry=car.y - Math.sin(car.heading)*24;  // titik knalpot
  if (car.boosting && sp > 12){
    for(let k=0;k<2;k++) car.fx.push({x:rx,y:ry,
      vx:-Math.cos(car.heading)*(70+Math.random()*60)+rand(22), vy:-Math.sin(car.heading)*(70+Math.random()*60)+rand(22),
      life:0, max:0.30+Math.random()*0.18, size:4+Math.random()*4, type:'fire'});
  }
  if (sp > 25 && Math.random()<0.6) car.fx.push({x:rx,y:ry,
    vx:-Math.cos(car.heading)*20+rand(14), vy:-Math.sin(car.heading)*20+rand(14),
    life:0, max:0.7+Math.random()*0.5, size:3+Math.random()*3, type:'smoke'});
  if (car.fx.length>70) car.fx.splice(0, car.fx.length-70);
}
function updateFx(car, dt){
  for(const p of car.fx){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.size += (p.type==='smoke'?18:7)*dt; p.vx*=0.92; p.vy*=0.92; }
  car.fx = car.fx.filter(p=>p.life<p.max);
}
function drawFx(car){
  for(const p of car.fx){ const a=1-p.life/p.max;
    if(p.type==='fire'){ const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);
      g.addColorStop(0,`rgba(255,240,150,${a})`); g.addColorStop(0.5,`rgba(255,140,30,${a*0.8})`); g.addColorStop(1,'rgba(200,40,0,0)');
      ctx.fillStyle=g; }
    else ctx.fillStyle=`rgba(150,150,160,${a*0.33})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
  }
}
</script>
</body>
</html>
