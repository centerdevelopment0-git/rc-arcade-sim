<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RC Kontroler</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --accent:#36c; --ok:#2e9; --off:#555;
          --text:#e8eaed; --track:#15171c; --edge:#2a2e37; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; touch-action:none; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif;
         height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

  header { padding:6px 12px; background:var(--panel); display:flex; gap:14px; align-items:center;
           justify-content:center; font-size:12px; flex:0 0 auto; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--off); display:inline-block; margin-right:5px; vertical-align:middle; }
  .dot.on { background:var(--ok); }
  header b { color:#fff; }

  main { flex:1; display:flex; gap:14px; padding:14px; min-height:0; }
  .side { flex:1; display:flex; flex-direction:column; align-items:center; }
  .label { font-size:13px; color:#9aa0b0; margin-bottom:6px; letter-spacing:.5px; }
  .label b { color:#fff; }

  /* kendali BELOK (horizontal) */
  #steerPad { flex:1; width:100%; background:var(--track); border:2px solid var(--edge);
              border-radius:18px; position:relative; display:flex; align-items:center; }
  #steerPad .mid { position:absolute; left:50%; top:10%; bottom:10%; width:2px; background:#2f3442; }
  #steerKnob { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
               width:84px; height:84px; border-radius:50%; background:var(--accent);
               box-shadow:0 6px 18px rgba(0,0,0,.5); display:grid; place-items:center;
               font-size:22px; color:#cfe0ff; }
  .arrows { position:absolute; width:100%; display:flex; justify-content:space-between;
            padding:0 18px; color:#5a6072; font-size:22px; pointer-events:none; }

  /* kendali GAS (vertikal) */
  #thrPad { flex:1; width:100%; background:var(--track); border:2px solid var(--edge);
            border-radius:18px; position:relative; }
  #thrPad .mid { position:absolute; top:50%; left:10%; right:10%; height:2px; background:#2f3442; }
  #thrKnob { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
             width:84px; height:84px; border-radius:50%; background:#2b8a4e;
             box-shadow:0 6px 18px rgba(0,0,0,.5); display:grid; place-items:center;
             font-size:22px; color:#d9ffe6; }
  .updown { position:absolute; height:100%; display:flex; flex-direction:column;
            justify-content:space-between; align-items:center; left:0; right:0;
            padding:10px 0; color:#5a6072; font-size:14px; pointer-events:none; }

  footer { padding:5px 12px; background:var(--panel); display:flex; gap:16px; justify-content:center; font-size:12px; flex:0 0 auto; }
  footer b { color:#fff; }
  .skillbar { display:flex; gap:8px; }
  .skillbtn { min-width:54px; padding:4px 8px; border-radius:9px; border:1px solid #2a2e37;
              background:#20242e; color:#fff; font-size:12px; cursor:pointer; text-align:center; line-height:1.15; }
  .skillbtn .ic { font-size:17px; display:block; }
  .skillbtn.active { background:#2b8a4e; border-color:#2ee98b; }
  .skillbtn.cooldown { opacity:.45; cursor:not-allowed; }
  .skillbtn .rem { font-size:10px; color:#cfe0ff; }
</style>
</head>
<body>
  <header>
    <span><span class="dot" id="d"></span><span id="st">menyambung…</span></span>
    <b>🎮 RC Kontroler</b>
    <label style="font-size:12px;color:#9aa0b0">Nama:
      <input id="pname" maxlength="16" placeholder="kamu"
             style="width:68px;background:#20242e;color:#fff;border:1px solid #2a2e37;border-radius:6px;padding:3px 6px">
    </label>
    <label style="font-size:12px;color:#9aa0b0">Mobil:
      <select id="carsel" style="background:#20242e;color:#fff;border:1px solid #2a2e37;border-radius:6px;padding:3px 6px">
        <option value="car1">RC1</option><option value="car2">RC2</option>
        <option value="car3">RC3</option><option value="car4">RC4</option>
        <option value="car5">RC5</option>
      </select>
    </label>
    <div id="skills" class="skillbar"></div>
  </header>

  <main>
    <!-- KIRI: BELOK -->
    <div class="side">
      <div class="label">👈 BELOK (<b id="strv">0.00</b>)</div>
      <div id="steerPad">
        <div class="mid"></div>
        <div class="arrows"><span>◀</span><span>▶</span></div>
        <div id="steerKnob">⟷</div>
      </div>
    </div>
    <!-- KANAN: GAS -->
    <div class="side">
      <div class="label">GAS 👉 (<b id="thrv">0.00</b>)</div>
      <div id="thrPad">
        <div class="mid"></div>
        <div class="updown"><span>▲ maju</span><span>mundur ▼</span></div>
        <div id="thrKnob">⥮</div>
      </div>
    </div>
  </main>

  <footer><span>Laju mobil: <b id="spd">0.0</b></span></footer>

<script>
let CAR = new URLSearchParams(location.search).get('car') || 'car1';
let throttle = 0, steer = 0;

// nama pemain (disimpan di browser)
const pname = document.getElementById('pname');
try { pname.value = localStorage.getItem('rc_name') || ''; } catch {}

// ---------- koneksi ke relay ----------
let ws;
function connect(){
  ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({ type:'hello', role:'controller', car:CAR, name:(pname.value||'Pemain') }));
  ws.onclose = () => { setDot(false,'putus — menyambung ulang…'); setTimeout(connect,1000); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'denied')
      setDot(false, CAR.toUpperCase()+' sedang dipakai '+(m.driver||'orang lain')+' — pilih mobil lain');
    if (m.type === 'presence')
      setDot(m.carOnline, m.carOnline ? (CAR.toUpperCase()+' • '+(m.driver||'kamu')) : ('menunggu '+CAR.toUpperCase()+'…'));
    if (m.type === 'telemetry') spd.textContent = m.speed.toFixed(1);
    if (m.type === 'skills') renderSkills(m.skills);
  };
}
// pemilih mobil / ganti nama: sambung ulang
const carsel = document.getElementById('carsel');
carsel.value = CAR;
carsel.addEventListener('change', () => { CAR = carsel.value; try { ws.close(); } catch {} });
pname.addEventListener('change', () => { try { localStorage.setItem('rc_name', pname.value); } catch {}; try { ws.close(); } catch {} });

// ---------- skill (klik icon = aktifkan) ----------
const skillsEl = document.getElementById('skills');
function renderSkills(list){
  skillsEl.innerHTML = (list||[]).map(s=>{
    const info = s.state==='standby' ? 'siap' : (s.remain/1000).toFixed(1)+'s';
    return `<button class="skillbtn ${s.state}" data-skill="${s.id}" ${s.state==='standby'?'':'disabled'}>
      <span class="ic">${s.icon}</span>${s.name}<span class="rem">${info}</span></button>`;
  }).join('');
}
skillsEl.addEventListener('click', e=>{ const b=e.target.closest('.skillbtn'); if(!b||b.disabled) return;
  if (ws && ws.readyState===1) ws.send(JSON.stringify({ type:'skill', car:CAR, skill:b.dataset.skill })); });
const d=document.getElementById('d'), st=document.getElementById('st'), spd=document.getElementById('spd');
const strv=document.getElementById('strv'), thrv=document.getElementById('thrv');
function setDot(on,t){ d.classList.toggle('on',on); st.textContent=t; }
connect();

// kirim perintah 20x/detik
setInterval(() => {
  if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({ type:'control', throttle, steer, t:Date.now() }));
}, 50);

// ---------- helper kendali 1-sumbu, multi-sentuh ----------
// axis:'x' (belok) atau 'y' (gas). Balik ke tengah saat dilepas.
function makeControl(pad, knob, axis, onValue){
  let pid = null;
  const clamp = v => Math.max(-1, Math.min(1, v));
  function update(ev){
    const r = pad.getBoundingClientRect();
    if (axis === 'x'){
      let x = (ev.clientX - r.left) / r.width;        // 0..1
      const v = clamp(x*2 - 1);                        // -1..1 (kiri..kanan)
      knob.style.left = (10 + (v+1)/2*80) + '%';       // gerak knob
      onValue(v);
    } else {
      let y = (ev.clientY - r.top) / r.height;         // 0..1
      const v = clamp(-(y*2 - 1));                      // atas=+1, bawah=-1
      knob.style.top = (10 + (1-(v+1)/2)*80) + '%';
      onValue(v);
    }
  }
  function reset(){
    if (axis === 'x'){ knob.style.left='50%'; } else { knob.style.top='50%'; }
    onValue(0);
  }
  pad.addEventListener('pointerdown', e => { pid = e.pointerId; pad.setPointerCapture(pid); update(e); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === pid) update(e); });
  const end = e => { if (e.pointerId === pid){ pid = null; reset(); } };
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
}

makeControl(document.getElementById('steerPad'), document.getElementById('steerKnob'),
            'x', v => { steer = +v.toFixed(2); strv.textContent = steer.toFixed(2); });
makeControl(document.getElementById('thrPad'), document.getElementById('thrKnob'),
            'y', v => { throttle = +v.toFixed(2); thrv.textContent = throttle.toFixed(2); });
</script>
</body>
</html>
