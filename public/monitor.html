<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Koneksi — RC Arcade Sim</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --edge:#2a2e37; --text:#e8eaed; --muted:#9aa0b0; --ok:#2ee98b; --in:#3f84d6; --out:#ffb454; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding:16px; }
  h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  h2 { font-size:12px; color:var(--muted); margin:0 0 10px; text-transform:uppercase; letter-spacing:.5px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:14px; }
  .tile, .panel, .card { background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:12px; }
  .tile .v { font-size:22px; font-weight:700; } .tile .k { color:var(--muted); font-size:12px; }
  .panel { margin-bottom:14px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  .card h3 { margin:0 0 2px; font-size:16px; display:flex; gap:8px; align-items:center; }
  .sw { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .who { color:var(--muted); font-size:12px; margin-bottom:8px; }
  .leds { display:flex; gap:16px; margin:8px 0; }
  .ledw { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--muted); }
  .led { width:14px; height:14px; border-radius:50%; background:#333; }
  .led.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .led.in { background:var(--in); box-shadow:0 0 8px var(--in); }
  .led.out { background:var(--out); box-shadow:0 0 8px var(--out); }
  .row { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; border-top:1px solid #20242e; }
  .row b { color:#fff; }
  .diag { font-size:12px; margin-top:8px; padding:6px 8px; border-radius:8px; background:#20242e; }
  .diag.bad { color:var(--bad); } .diag.ok { color:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:4px 6px; border-top:1px solid #20242e; }
  svg text { fill:var(--muted); font-size:11px; }
  a { color:#8ab4ff; }
</style>
</head>
<body>
<h1>📡 Dashboard Koneksi — Balapan 3D</h1>
<div class="sub">Jalur: <b>HP (input)</b> → <b>SERVER</b> → <b>mobil sim 3D / RC fisik (output)</b>. LED biru = input masuk, oranye = perintah diterapkan ke mobil.
  Layar arena: <a href="/race3d.html">race3d.html</a></div>

<div class="tiles" id="tiles"></div>
<div class="panel"><h2>Peta koneksi</h2><svg id="map" width="100%" height="190" viewBox="0 0 760 190"></svg></div>
<h2>Status per mobil (input → output)</h2>
<div class="cards" id="cards"></div>
<div class="panel" style="margin-top:14px"><h2>Klien tersambung</h2><table id="clients"></table></div>

<script>
const COLORS = { car1:'#3f84d6', car2:'#2ee98b', car3:'#ff8a3d' };
const PHASE = { lobby:'Latihan bebas', countdown:'Hitung mundur', racing:'Balapan', finished:'Selesai' };
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const rc = id => id.toUpperCase().replace('CAR', 'RC');
let ws, last = null;

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/race`);
  ws.onopen = () => ws.send(JSON.stringify({ type:'join', role:'monitor' }));
  ws.onclose = () => { $('tiles').innerHTML = '<div class="tile">putus — menyambung ulang…</div>'; setTimeout(connect, 1000); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'snapshot') { last = m; render(m); } };
}
connect();

// kenapa input masuk tapi tidak ada output? (diagnosis yang sama dengan logika server)
function diagnose(v, s) {
  const inOk = v.io.msSinceInput != null && v.io.msSinceInput < 1000;
  const outOk = v.io.msSinceOutput != null && v.io.msSinceOutput < 300;
  if (!v.driver && v.kind !== 'physical') return ['', 'Belum ada pengemudi'];
  if (!inOk) return ['bad', 'Tidak ada input dari HP > 1 dtk → failsafe, mobil berhenti'];
  if (s.phase === 'countdown') return ['', 'Input ditahan selama hitung mundur'];
  if (!outOk) return ['bad', 'Input masuk tapi tidak diterapkan ke mobil'];
  return ['ok', v.kind === 'physical' ? 'Input → perintah ke RC fisik ✔' : 'Input → mobil sim 3D bergerak ✔'];
}

function render(s) {
  const n = s.net;
  const drivers = n.clients.filter(c => c.role === 'driver').length;
  $('tiles').innerHTML = [
    [PHASE[s.phase], 'fase'], [drivers + ' / 3', 'pengemudi'], [n.clients.length, 'klien'],
    [n.inPerSec + '/s', 'pesan masuk'], [n.outPerSec + '/s', 'pesan keluar'], [n.kbOutPerSec + ' kB/s', 'data keluar'],
  ].map(([v, k]) => `<div class="tile"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');

  $('cards').innerHTML = s.vehicles.map(v => {
    const inOn = v.io.msSinceInput != null && v.io.msSinceInput < 250;
    const outOn = v.io.msSinceOutput != null && v.io.msSinceOutput < 250;
    const online = !!v.driver || v.kind === 'physical';
    const rtt = n.clients.find(c => c.role === 'driver' && c.car === v.id)?.rtt;
    const [cls, text] = diagnose(v, s);
    return `<div class="card"><h3><span class="sw" style="background:${COLORS[v.id]}"></span>${rc(v.id)}
        <span style="font-size:12px;color:var(--muted);font-weight:400">${v.kind === 'physical' ? '🔌 RC fisik' : 'sim 3D'}</span></h3>
      <div class="who">👤 ${v.driver ? esc(v.driver) : '(kosong)'}</div>
      <div class="leds">
        <div class="ledw"><div class="led ${online ? 'on' : ''}"></div>ONLINE</div>
        <div class="ledw"><div class="led ${inOn ? 'in' : ''}"></div>INPUT</div>
        <div class="ledw"><div class="led ${outOn ? 'out' : ''}"></div>OUTPUT</div>
      </div>
      <div class="row"><span>Gas / Belok</span><b>${v.input.throttle.toFixed(2)} / ${v.input.steer.toFixed(2)}</b></div>
      <div class="row"><span>Input dari HP /dtk</span><b>${v.io.inPerSec}</b></div>
      <div class="row"><span>Output ke mobil /dtk</span><b>${v.io.outPerSec}</b></div>
      <div class="row"><span>Laju</span><b>${(Math.abs(v.speed) * 3.6).toFixed(1)} km/j</b></div>
      <div class="row"><span>RTT HP</span><b>${rtt == null ? '–' : rtt + ' ms'}</b></div>
      <div class="row"><span>Skor</span><b>${v.score}</b></div>
      <div class="diag ${cls}">${text}</div></div>`;
  }).join('');

  $('clients').innerHTML = '<tr style="color:var(--muted)"><td>Peran</td><td>Nama</td><td>Mobil</td><td>RTT</td><td>Masuk/s</td><td>Keluar/s</td></tr>' +
    n.clients.map(c => `<tr><td>${esc(c.role)}</td><td>${esc(c.name)}</td><td>${c.car ? rc(c.car) : '–'}</td>
      <td>${c.rtt == null ? '–' : c.rtt + ' ms'}</td><td>${c.inPerSec}</td><td>${c.outPerSec}</td></tr>`).join('');

  // peta: HP pengemudi (kiri) -> server (tengah) -> mobil (kanan)
  const ys = [40, 95, 150];
  let svg = `<rect x="320" y="70" width="120" height="50" rx="10" fill="#20242e" stroke="#2a2e37"/><text x="380" y="92" text-anchor="middle" style="fill:#fff;font-weight:700">SERVER</text>
    <text x="380" y="108" text-anchor="middle">${n.inPerSec} in · ${n.outPerSec} out /s</text>`;
  s.vehicles.forEach((v, i) => {
    const y = ys[i], inOn = v.io.msSinceInput != null && v.io.msSinceInput < 250, outOn = v.io.msSinceOutput != null && v.io.msSinceOutput < 250;
    svg += `<line x1="150" y1="${y}" x2="320" y2="95" stroke="${inOn ? '#3f84d6' : '#2a2e37'}" stroke-width="${inOn ? 3 : 1.5}"/>
      <line x1="440" y1="95" x2="610" y2="${y}" stroke="${outOn ? '#ffb454' : '#2a2e37'}" stroke-width="${outOn ? 3 : 1.5}"/>
      <circle cx="140" cy="${y}" r="9" fill="${v.driver ? COLORS[v.id] : '#333'}"/><text x="125" y="${y + 4}" text-anchor="end">📱 ${v.driver ? esc(v.driver) : '–'}</text>
      <circle cx="620" cy="${y}" r="9" fill="${COLORS[v.id]}"/><text x="636" y="${y + 4}">${rc(v.id)}${v.kind === 'physical' ? ' 🔌' : ''}</text>`;
  });
  $('map').innerHTML = svg;
}
</script>
</body>
</html>
