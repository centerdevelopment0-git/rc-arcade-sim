<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard koneksi</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<link rel="stylesheet" href="/ui.css">
<style>
  main { max-width: 1200px; margin: 0 auto; padding: 32px max(24px, env(safe-area-inset-right)) 48px max(24px, env(safe-area-inset-left)); }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
  h1 { font-size: 34px; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 15px; color: var(--label-2); margin-top: 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  h2 { font-size: 20px; font-weight: 600; margin: 32px 0 12px; }
  .card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .tiles .v { font: 700 28px/1.1 var(--font-num); font-variant-numeric: tabular-nums; }
  .tiles .k { font-size: 13px; color: var(--label-2); margin-top: 4px; }
  .cars { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .cars h3 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 13px; font-weight: 400; color: var(--label-2); background: var(--fill); border-radius: var(--r-sm); padding: 2px 8px; margin-left: auto;
           display: inline-flex; align-items: center; gap: 4px; }
  .who { color: var(--label-2); font-size: 15px; margin: 4px 0 12px; display: flex; align-items: center; gap: 4px; }
  .leds { display: flex; gap: 16px; font-size: 13px; color: var(--label-2); margin-bottom: 8px; }
  .leds span { display: inline-flex; align-items: center; gap: 8px; }
  .leds .dot { background: var(--fill); }
  .leds .on { background: var(--ok); } .leds .in { background: var(--accent); } .leds .out { background: var(--warn); }
  dl { margin: 0; font-size: 15px; }
  dl div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; box-shadow: inset 0 .5px 0 var(--separator); }
  dt { color: var(--label-2); } dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .diag { font-size: 15px; margin-top: 12px; padding: 8px 12px; border-radius: var(--r-md); background: var(--fill); }
  .diag.bad { color: var(--danger); } .diag.ok { color: var(--ok); }
  .table { padding: 0; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font-weight: 400; font-size: 13px; color: var(--label-2); padding: 12px 16px 8px; }
  td { padding: 10px 16px; box-shadow: inset 0 .5px 0 var(--separator); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  td.bad { color: var(--danger); }
  #map text { fill: var(--label-2); font-size: 13px; }
  #map .srv { fill: var(--fill); }
  #map .srv-t { fill: var(--label); font-weight: 600; }
  a { color: var(--accent); }
</style>
</head>
<body><main>
<header>
  <div>
    <h1>Koneksi</h1>
    <div class="legend">
      <span><i class="dot" style="background:var(--accent)"></i>Input masuk dari HP</span>
      <span><i class="dot" style="background:var(--warn)"></i>Perintah diterapkan ke mobil</span>
    </div>
  </div>
  <a class="btn" href="/race3d.html"><svg class="i"><use href="/icons.svg#display"/></svg>Layar arena</a>
</header>

<h2>Ringkasan</h2>
<div class="tiles" id="tiles"></div>
<h2>Peta koneksi</h2>
<div class="card"><svg id="map" width="100%" height="190" viewBox="0 0 760 190" role="img" aria-label="Jalur data dari HP pengemudi ke server lalu ke mobil"></svg></div>
<h2>Mobil</h2>
<div class="cars" id="cards"></div>
<h2>Klien tersambung</h2>
<div class="card table"><table id="clients"></table></div>
</main>

<script>
const COLORS = { car1:'var(--rc1)', car2:'var(--rc2)', car3:'var(--rc3)' };
const PHASE = { lobby:'Latihan bebas', countdown:'Hitung mundur', racing:'Balapan', finished:'Selesai' };
const ROLE = { driver:'Pengemudi', spectator:'Layar arena', monitor:'Dashboard', device:'RC fisik' };
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const rc = id => id.toUpperCase().replace('CAR', 'RC');
const icon = name => `<svg class="i"><use href="/icons.svg#${name}"/></svg>`;
let ws, last = null;

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/race`);
  ws.onopen = () => ws.send(JSON.stringify({ type:'join', role:'monitor' }));
  ws.onclose = () => { $('tiles').innerHTML = '<div class="card" style="color:var(--warn)">Koneksi putus. Menyambung ulang...</div>'; setTimeout(connect, 1000); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'snapshot') { last = m; render(m); } };
}
connect();

// kenapa input masuk tapi tidak ada output? (diagnosis yang sama dengan logika server)
function diagnose(v, s) {
  const inOk = v.io.msSinceInput != null && v.io.msSinceInput < 1000;
  const outOk = v.io.msSinceOutput != null && v.io.msSinceOutput < 300;
  if (!v.driver && v.kind !== 'physical') return ['', 'Belum ada pengemudi'];
  if (!inOk) return ['bad', 'Tidak ada input dari HP lebih dari 1 detik. Failsafe menghentikan mobil.'];
  if (s.phase === 'countdown') return ['', 'Input ditahan selama hitung mundur'];
  if (!outOk) return ['bad', 'Input masuk tetapi tidak diterapkan ke mobil'];
  return ['ok', v.kind === 'physical' ? 'Perintah sampai ke RC fisik' : 'Mobil sim 3D mengikuti input'];
}

function render(s) {
  const n = s.net;
  const drivers = n.clients.filter(c => c.role === 'driver').length;
  $('tiles').innerHTML = [
    [PHASE[s.phase], 'Fase'], [drivers + ' / 3', 'Pengemudi'], [n.clients.length, 'Klien'],
    [n.inPerSec + '/s', 'Pesan masuk'], [n.outPerSec + '/s', 'Pesan keluar'], [n.kbOutPerSec + ' kB/s', 'Data keluar'],
  ].map(([v, k]) => `<div class="card"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');

  $('cards').innerHTML = s.vehicles.map(v => {
    const inOn = v.io.msSinceInput != null && v.io.msSinceInput < 250;
    const outOn = v.io.msSinceOutput != null && v.io.msSinceOutput < 250;
    const online = !!v.driver || v.kind === 'physical';
    const rtt = n.clients.find(c => c.role === 'driver' && c.car === v.id)?.rtt;
    const [cls, text] = diagnose(v, s);
    return `<div class="card"><h3><i class="dot" style="background:${COLORS[v.id]}"></i>${rc(v.id)}
        <span class="badge">${v.kind === 'physical' ? icon('plug') + 'RC fisik' : 'Sim 3D'}</span></h3>
      <div class="who">${icon('person')}${v.driver ? esc(v.driver) : 'Kosong'}</div>
      <div class="leds">
        <span><i class="dot ${online ? 'on' : ''}"></i>Online</span>
        <span><i class="dot ${inOn ? 'in' : ''}"></i>Input</span>
        <span><i class="dot ${outOn ? 'out' : ''}"></i>Output</span>
      </div>
      <dl>
        <div><dt>Gas</dt><dd>${v.input.throttle.toFixed(2)}</dd></div>
        <div><dt>Belok</dt><dd>${v.input.steer.toFixed(2)}</dd></div>
        <div><dt>Input dari HP</dt><dd>${v.io.inPerSec}/s</dd></div>
        <div><dt>Output ke mobil</dt><dd>${v.io.outPerSec}/s</dd></div>
        <div><dt>Laju</dt><dd>${(Math.abs(v.speed) * 3.6).toFixed(1)} km/j</dd></div>
        <div><dt>RTT HP</dt><dd style="${rtt > 200 ? 'color:var(--danger)' : ''}">${rtt == null ? '–' : rtt + ' ms'}</dd></div>
        <div><dt>Skor</dt><dd>${v.score}</dd></div>
      </dl>
      <div class="diag ${cls}">${text}</div></div>`;
  }).join('');

  $('clients').innerHTML = '<tr><th>Peran</th><th>Nama</th><th>Mobil</th><th class="n">RTT</th><th class="n">Masuk</th><th class="n">Keluar</th></tr>' +
    n.clients.map(c => `<tr><td>${ROLE[c.role] || esc(c.role)}</td><td>${esc(c.name)}</td><td>${c.car ? rc(c.car) : '–'}</td>
      <td class="n ${c.rtt > 200 ? 'bad' : ''}">${c.rtt == null ? '–' : c.rtt + ' ms'}</td><td class="n">${c.inPerSec}/s</td><td class="n">${c.outPerSec}/s</td></tr>`).join('');

  // peta: HP pengemudi (kiri) -> server (tengah) -> mobil (kanan)
  const ys = [40, 95, 150];
  let svg = `<rect class="srv" x="320" y="66" width="120" height="58" rx="12"/><text class="srv-t" x="380" y="91" text-anchor="middle">Server</text>
    <text x="380" y="110" text-anchor="middle">${n.inPerSec}/s masuk</text>`;
  s.vehicles.forEach((v, i) => {
    const y = ys[i], inOn = v.io.msSinceInput != null && v.io.msSinceInput < 250, outOn = v.io.msSinceOutput != null && v.io.msSinceOutput < 250;
    svg += `<line x1="150" y1="${y}" x2="320" y2="95" style="stroke:${inOn ? 'var(--accent)' : 'var(--separator)'}" stroke-width="${inOn ? 3 : 1.5}"/>
      <line x1="440" y1="95" x2="610" y2="${y}" style="stroke:${outOn ? 'var(--warn)' : 'var(--separator)'}" stroke-width="${outOn ? 3 : 1.5}"/>
      <circle cx="140" cy="${y}" r="8" style="fill:${v.driver ? COLORS[v.id] : 'var(--fill)'}"/><text x="124" y="${y + 4}" text-anchor="end">${v.driver ? esc(v.driver) : 'Tanpa pengemudi'}</text>
      <circle cx="620" cy="${y}" r="8" style="fill:${COLORS[v.id]}"/><text x="636" y="${y + 4}">${rc(v.id)}${v.kind === 'physical' ? ' (fisik)' : ''}</text>`;
  });
  $('map').innerHTML = svg;
}
</script>
</body>
</html>
