<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC Kontroler Keyboard</title>
<style>
  :root{ --bg:#0f1115; --panel:#1a1d24; --edge:#2a2e37; --text:#e8eaed; --muted:#9aa0b0; --ok:#2e9; --accent:#3f84d6; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;
       min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:18px;gap:16px}
  .dot{width:10px;height:10px;border-radius:50%;background:#555;display:inline-block;margin-right:6px}
  .dot.on{background:var(--ok)}
  h1{font-size:18px;margin:0}
  .status{font-size:13px;color:var(--muted)} .status.bad{color:#f66}
  .carpick{display:flex;gap:8px}
  .carpick button{width:52px;height:46px;border-radius:10px;border:1px solid var(--edge);background:#20242e;
                  color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .carpick button.sel{background:var(--accent);border-color:var(--accent)}
  .keys{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:8px}
  .key{display:grid;place-items:center;background:#20242e;border:1px solid var(--edge);border-radius:10px;
       font-size:18px;color:var(--muted);transition:all .06s}
  .key.on{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(2px)}
  .key.blank{visibility:hidden}
  .readout{display:flex;gap:22px;font-size:14px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 18px}
  .readout b{color:#fff}
  .hint{font-size:12px;color:var(--muted);text-align:center;max-width:380px}
  .skillbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .skillbtn{min-width:70px;padding:8px 10px;border-radius:10px;border:1px solid var(--edge);
            background:#20242e;color:#fff;font-size:13px;cursor:pointer;text-align:center;line-height:1.2}
  .skillbtn .ic{font-size:20px;display:block}
  .skillbtn .key{font-size:10px;color:var(--muted)}
  .skillbtn .rem{font-size:11px;color:#cfe0ff}
  .skillbtn.active{background:#2b8a4e;border-color:#2ee98b}
  .skillbtn.cooldown{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
  <h1>⌨️ RC Kontroler (Keyboard)</h1>
  <div class="status"><span class="dot" id="d"></span><span id="st">menyambung…</span></div>

  <div class="carpick" id="carpick"></div>

  <div class="keys">
    <div class="key blank"></div>
    <div class="key" id="k-up">W</div>
    <div class="key blank"></div>
    <div class="key" id="k-left">A</div>
    <div class="key" id="k-down">S</div>
    <div class="key" id="k-right">D</div>
  </div>

  <div class="readout">
    <span>Gas: <b id="thr">0.00</b></span>
    <span>Belok: <b id="str">0.00</b></span>
    <span>Laju mobil: <b id="spd">0.0</b></span>
  </div>

  <div class="skillbar" id="skills"></div>

  <div class="hint">Pilih mobil: tekan angka <b>1–5</b> (atau klik tombol di atas).<br>
    Nyetir: <b>W/▲</b> maju · <b>S/▼</b> mundur · <b>A/◀</b> kiri · <b>D/▶</b> kanan. Lepas tombol = berhenti/lurus.</div>

<script>
const NCARS = 5;
let CAR = 'car4';                 // default: mobil manual (bot biasanya pegang car1-3)
let throttle = 0, steer = 0;
const pressed = new Set();

// ---------- tombol pilih mobil ----------
const carpick = document.getElementById('carpick');
for (let i=1;i<=NCARS;i++){
  const b=document.createElement('button'); b.textContent='RC'+i; b.dataset.car='car'+i;
  b.onclick=()=>selectCar('car'+i); carpick.appendChild(b);
}
function selectCar(car){
  CAR=car;
  [...carpick.children].forEach(b=>b.classList.toggle('sel', b.dataset.car===car));
  try{ ws.close(); }catch{}          // sambung ulang ke mobil baru
}

// ---------- koneksi ----------
let ws;
function connect(){
  ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);
  ws.onopen=()=>ws.send(JSON.stringify({type:'hello',role:'controller',car:CAR,name:'Keyboard'}));
  ws.onclose=()=>{ setDot(false,'putus — menyambung ulang…'); setTimeout(connect,1000); };
  ws.onmessage=(e)=>{
    const m=JSON.parse(e.data);
    if(m.type==='denied') setDot(false, CAR.toUpperCase()+' dipakai '+(m.driver||'orang lain')+' — pilih mobil lain', true);
    if(m.type==='presence') setDot(m.carOnline, m.carOnline?(CAR.toUpperCase()+' • kamu menyetir'):('menunggu '+CAR.toUpperCase()+'…'));
    if(m.type==='telemetry') spd.textContent=m.speed.toFixed(1);
    if(m.type==='skills'){ lastSkills=m.skills||[]; renderSkills(); }
  };
}

// ---------- skill ----------
const SKILL_KEYS=[' ','q','e','r','f','g'], SKILL_KEY_LABEL=['Space','Q','E','R','F','G'];
let lastSkills=[];
const skillsEl=document.getElementById('skills');
function renderSkills(){
  skillsEl.innerHTML=lastSkills.map((s,i)=>{
    const info=s.state==='standby'?'siap':(s.remain/1000).toFixed(1)+'s';
    return `<button class="skillbtn ${s.state}" data-skill="${s.id}" ${s.state==='standby'?'':'disabled'}>
      <span class="ic">${s.icon}</span>${s.name}<span class="rem">${info}</span><span class="key">[${SKILL_KEY_LABEL[i]||'-'}]</span></button>`;
  }).join('');
}
function activateSkill(id){ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'skill',car:CAR,skill:id})); }
skillsEl.addEventListener('click',e=>{ const b=e.target.closest('.skillbtn'); if(!b||b.disabled)return; activateSkill(b.dataset.skill); });
const d=document.getElementById('d'), stEl=document.getElementById('st');
const thrEl=document.getElementById('thr'), strEl=document.getElementById('str'), spd=document.getElementById('spd');
function setDot(on,t,bad){ d.classList.toggle('on',on); stEl.textContent=t; stEl.parentElement.classList.toggle('bad',!!bad); }
selectCar(CAR); connect();

// kirim perintah 20x/detik
setInterval(()=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'control',throttle,steer,t:Date.now()})); },50);

// ---------- keyboard ----------
const MAP={ 'w':'up','arrowup':'up','s':'down','arrowdown':'down','a':'left','arrowleft':'left','d':'right','arrowright':'right' };
function recompute(){
  throttle=(pressed.has('up')?1:0)+(pressed.has('down')?-1:0);
  steer   =(pressed.has('right')?1:0)+(pressed.has('left')?-1:0);
  thrEl.textContent=throttle.toFixed(2); strEl.textContent=steer.toFixed(2);
  for(const dir of ['up','down','left','right'])
    document.getElementById('k-'+dir).classList.toggle('on', pressed.has(dir));
}
addEventListener('keydown',(e)=>{
  const k=e.key.toLowerCase();
  if(k>='1'&&k<='5'){ selectCar('car'+k); return; }
  const si=SKILL_KEYS.indexOf(k);
  if(si>=0){ e.preventDefault(); const s=lastSkills[si]; if(s && s.state==='standby') activateSkill(s.id); return; }
  if(MAP[k]){ e.preventDefault(); if(!pressed.has(MAP[k])){ pressed.add(MAP[k]); recompute(); } }
});
addEventListener('keyup',(e)=>{
  const k=e.key.toLowerCase();
  if(MAP[k]){ e.preventDefault(); pressed.delete(MAP[k]); recompute(); }
});
addEventListener('blur',()=>{ pressed.clear(); recompute(); });  // kehilangan fokus = berhenti
</script>
</body>
</html>
